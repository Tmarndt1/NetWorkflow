name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore dependencies
        run: dotnet restore NetWorkflow.sln

      - name: Build
        run: dotnet build NetWorkflow.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test NetWorkflow.Tests/NetWorkflow.Tests.csproj
          -c Release
          --no-build
          --no-restore
          -f net8.0
          -v normal
          --filter "TestCategory!=very.slow"